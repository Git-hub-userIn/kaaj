<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Subtle Hairline Badge -->
  <circle cx="32" cy="32" r="29" fill="#FAF6F0" stroke="#DCD5C9" stroke-width="1.5" />
  
  <g transform="rotate(22, 32, 32)">
    <!-- Outer Feather Silhouette (Slate) -->
    <path d="M32 10 C 46 10, 47 33, 32 45 C 17 33, 18 10, 32 10 Z" fill="none" stroke="#6E7A85" stroke-width="2" />
    <!-- Terracotta Ring -->
    <ellipse cx="32" cy="24" rx="8" ry="10" fill="#B8532A" />
    <!-- Deep Peacock Teal Heart -->
    <ellipse cx="32" cy="25.5" rx="4.5" ry="5.5" fill="#1F5C66" />
    <!-- Quill Stem & Nib Tip -->
    <path d="M32 34 L32 54" stroke="#B8532A" stroke-width="2.5" stroke-linecap="round" />
    <!-- Writing Ink Line at Tip -->
    <path d="M26 54 Q 32 51, 38 54" fill="none" stroke="#6E7A85" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
