<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaaj — Visual Scrapbook</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f6f4ee;
        color: #1e1c1a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      html.dark body {
        background-color: #18181b;
        color: #f4f4f5;
      }
      html.dark [data-testid="home-screen"] {
        background-color: #121214 !important;
        background-image: none !important;
        color: #f4f4f5 !important;
      }
      html.dark [data-testid="editor-screen"] {
        background-color: #18181b !important;
        color: #f4f4f5 !important;
      }
      html.dark [data-testid="editor-content-area"] {
        background-color: #27272a !important;
        border-color: #3f3f46 !important;
        color: #f4f4f5 !important;
      }
      html.dark [data-testid="tiptap-editor"] {
        color: #f4f4f5 !important;
      }
      html.dark [data-testid="entry-title-input"] {
        color: #f4f4f5 !important;
      }
      /* Focus Mode styles */
      [data-focus-mode="true"] header {
        display: none !important;
      }
      [data-focus-mode="true"] [data-testid="tags-bar"] {
        display: none !important;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('kaaj_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
