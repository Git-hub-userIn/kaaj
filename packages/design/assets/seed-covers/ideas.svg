<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!-- Crisp Studio Background -->
  <rect width="800" height="1000" fill="#f8f5ee"/>

  <!-- Bauhaus Geometric Paper Collage Cutouts -->
  <!-- Ochre Yellow Arc -->
  <path d="M120,440 A260,260 0 0,1 640,440 Z" fill="#dca142" opacity="0.95"/>

  <!-- Terracotta Wedge -->
  <polygon points="180,320 620,320 400,680" fill="#c25e38" opacity="0.9"/>

  <!-- Deep Ink Semi-Circle -->
  <path d="M400,680 A160,160 0 0,1 400,1000 Z" fill="#1e1c1a"/>

  <!-- Indigo Modernist Grid Segment -->
  <g stroke="#3b4d61" stroke-width="2" opacity="0.4">
    <line x1="80" y1="160" x2="360" y2="160"/>
    <line x1="80" y1="200" x2="360" y2="200"/>
    <line x1="80" y1="240" x2="360" y2="240"/>
    <line x1="160" y1="80" x2="160" y2="280"/>
    <line x1="220" y1="80" x2="220" y2="280"/>
    <line x1="280" y1="80" x2="280" y2="280"/>
  </g>

  <!-- Thought Constellation Spark Points -->
  <g fill="#c25e38">
    <circle cx="580" cy="180" r="14"/>
    <circle cx="680" cy="240" r="8"/>
    <circle cx="520" cy="260" r="10"/>
    <circle cx="630" cy="340" r="6"/>
    <line x1="580" y1="180" x2="680" y2="240" stroke="#c25e38" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="580" y1="180" x2="520" y2="260" stroke="#c25e38" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="680" y1="240" x2="630" y2="340" stroke="#c25e38" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Border -->
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#ddd7c7" stroke-width="2"/>
</svg>
